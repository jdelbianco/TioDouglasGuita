services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    env_file:
      - ./packages/database/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend-professor:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_WORKSPACE: "@douglasguita/frontend-professor"
        VITE_API_URL: /api
    container_name: frontend_professor
    depends_on:
      - backend-api
    ports:
      - "5173:80"
    restart: unless-stopped

  frontend-aluno:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_WORKSPACE: "@douglasguita/frontend-aluno"
        VITE_API_URL: /api
    container_name: frontend_aluno
    depends_on:
      - backend-api
    ports:
      - "5174:80"
    restart: unless-stopped

  proxy-reverso:
    image: nginx:alpine
    container_name: proxy_reverso
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend-professor
      - frontend-aluno
    restart: unless-stopped
